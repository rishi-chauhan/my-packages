[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image_array_and_histogram"
version = "1.2.0"
description = "Utilities to get arrays & histograms from grayscale images and build images from arrays."
readme = "README.md"
authors = [{ name = "Rishi Raj Singh Chauhan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "Pillow>=10.0",
]
keywords = ["image", "histogram", "numpy", "pillow", "grayscale"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build", "twine", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/rishi-chauhan/my-packages"
"Issue Tracker" = "https://github.com/rishi-chauhan/my-packages/issues"
Changelog = "https://github.com/rishi-chauhan/my-packages/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["image_array_and_histogram"]

[tool.setuptools.package-data]
image_array_and_histogram = ["py.typed"]

[tool.mypy]
files = ["image_array_and_histogram"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF", "PERF", "PT", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]   # any unexpected warning fails a test; expected ones use pytest.warns

[tool.coverage.run]
branch = true
source = ["image_array_and_histogram"]
