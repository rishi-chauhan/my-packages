[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image_array_and_histogram"
version = "2.1.0"
description = "Fast image histograms, exposure statistics and histogram comparison for NumPy/Pillow, with a CLI."
readme = "README.md"
authors = [{ name = "Rishi Raj Singh Chauhan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.23.2",
  "Pillow>=13.0.0",
]
keywords = ["image", "histogram", "numpy", "pillow", "grayscale", "statistics", "exposure", "dataset", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "build",
  "twine",
  "ruff>=0.6",
  "mypy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
imghist = "image_array_and_histogram.cli:main"

[project.urls]
Homepage = "https://github.com/rishi-chauhan/imghist"
"Issue Tracker" = "https://github.com/rishi-chauhan/imghist/issues"
Changelog = "https://github.com/rishi-chauhan/imghist/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["image_array_and_histogram"]

[tool.setuptools.package-data]
image_array_and_histogram = ["py.typed"]

[tool.mypy]
files = ["image_array_and_histogram"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF", "PERF", "PT", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]   # any unexpected warning fails a test; expected ones use pytest.warns

[tool.coverage.run]
branch = true
source = ["image_array_and_histogram"]
omit = ["*/image_array_and_histogram/__main__.py"]  # exercised via a subprocess test
